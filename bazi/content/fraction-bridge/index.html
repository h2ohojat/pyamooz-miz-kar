<!--@META@-->
<style>
/*@FONT@*/
:root{color-scheme:light;--ink:#2b2a33;--muted:#6d6a72;--card:#fffaf0;--card-2:#fff3dc;--line:#ecdcbf;--green:#1f7a59;--green-2:#2f9b72;--orange:#f08a3c;--gold:#ffc83d;--red:#d9534f;--glass:#fffaf0e6;--shadow:0 10px 30px #3a2a2229}
[data-theme=dark]{color-scheme:dark;--ink:#f3eee2;--muted:#b8b1a2;--card:#242632;--card-2:#2f3140;--line:#454859;--glass:#242632e8;--shadow:0 10px 30px #0006}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#14281f}
body{font:14px Vazirmatn,Tahoma,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;transition:transform .12s,background .15s,box-shadow .15s}
button:hover:not(:disabled){background:var(--card-2)}button:active:not(:disabled){transform:translateY(1px) scale(.98)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}svg.i{width:22px;height:22px;vertical-align:middle;flex-shrink:0}.icons{position:absolute;width:0;height:0;overflow:hidden}
.shell{position:fixed;inset:0;width:var(--game-width,100vw);height:var(--game-height,100dvh);overflow:hidden;isolation:isolate;background:#8fd3f4}
.rotated .shell{inset:auto;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;z-index:3;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));left:max(12px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud>*{pointer-events:auto}.chip{display:flex;align-items:center;gap:9px;min-height:48px;padding:6px 14px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid #ffffff99;border-radius:16px;box-shadow:var(--shadow)}
.level-chip{flex-direction:column;align-items:flex-start;gap:0;justify-content:center;text-align:right}.level-chip small{font-size:10px;color:var(--muted)}.level-chip strong{font-size:14px}
.stats{display:flex;gap:6px}.stat{gap:6px;font-weight:800;font-size:16px}.stat svg{width:22px;height:22px}.stat small{font-weight:500;font-size:10px;color:var(--muted)}
.actions{display:flex;gap:6px}.actions button{width:48px;height:48px;padding:0;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);border-color:#ffffff99;box-shadow:var(--shadow)}
.actions button[aria-pressed=true]{background:#dff3e8;border-color:var(--green-2)}[data-theme=dark] .actions button[aria-pressed=true]{background:#2c5a47}
.toast{position:absolute;z-index:4;top:76px;left:50%;transform:translate(-50%,-6px);max-width:min(560px,80%);padding:10px 18px;border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);box-shadow:var(--shadow);border:1px solid #ffffffaa;text-align:center;font-size:14px;line-height:1.9;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.good{border-color:#7fd3a8;background:#effcf4f2;color:#155a40}.toast.bad{border-color:#f1a29a;background:#fff1eef2;color:#8a2a22}.toast b{font-size:17px}
[data-theme=dark] .toast.good{background:#1d3b2ff2;color:#bff0d6}[data-theme=dark] .toast.bad{background:#40211ff2;color:#ffd0c9}
.tray-wrap{position:absolute;z-index:3;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 24px);pointer-events:none}.touch .tray-wrap{max-width:calc(100% - 340px)}
.mode{pointer-events:none;padding:4px 12px;border-radius:99px;background:#1f2a24cc;color:#fff;font-size:12px;line-height:1.8;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.mode.build{background:#1f7a59ee}.mode.split{background:#b8621f;}
.tray{pointer-events:auto;display:flex;align-items:stretch;gap:6px;padding:7px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid #ffffffaa;border-radius:18px;box-shadow:var(--shadow);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tray-empty{display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--muted);white-space:nowrap;min-height:52px}
.plank-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:62px;min-height:56px;padding:6px 8px;border-radius:13px;background:var(--card);flex-shrink:0;position:relative}
.plank-card .bar{display:block;height:9px;border-radius:3px;background:linear-gradient(#f2c27f,#c98c4c);border:1.5px solid #6b3f1f;min-width:5px}
.plank-card .count{position:absolute;top:-6px;left:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--card)}
.armed .plank-card{border-color:var(--green-2);box-shadow:0 0 0 2px #2f9b7233}.armed.split-mode .plank-card{border-color:var(--orange);box-shadow:0 0 0 2px #f08a3c33}
.frac{display:inline-flex;align-items:center;gap:4px;direction:rtl;font-weight:800;line-height:1}.frac .fr{display:inline-flex;flex-direction:column;align-items:center;font-size:.86em}.frac .fr i{font-style:normal}.frac .fr i:first-child{border-bottom:2px solid currentColor;padding:0 2px 1px;margin-bottom:1px}
.take-back{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;min-width:56px;padding:4px 8px;flex-shrink:0}
.zone{position:absolute;z-index:2;bottom:0;height:66%;display:none;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}.touch .zone{display:block}.zone-move{left:0;width:42%}.zone-jump{right:0;width:34%}
.pad{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:none}
.padbtn{width:78px;height:78px;border-radius:24px;background:#ffffff55;backdrop-filter:blur(8px);border:2px solid #ffffffaa;color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0002;transition:transform .05s,background .05s}
.padbtn svg{width:34px;height:34px}.padbtn.on{background:#ffffffb0;transform:scale(.92)}
.pad.move{left:max(14px,env(safe-area-inset-left))}.pad.jump{right:max(14px,env(safe-area-inset-right))}.pad.jump .padbtn{width:94px;height:94px;border-radius:50%;background:#f08a3c99}.pad.jump .padbtn.on{background:#f08a3ce0}
.save{position:absolute;z-index:2;bottom:max(6px,env(safe-area-inset-bottom));right:max(14px,env(safe-area-inset-right));font-size:10px;color:#fff;text-shadow:0 1px 2px #0008;max-width:240px;line-height:1.6}.touch .save{display:none}
.keys{position:absolute;z-index:2;bottom:max(6px,env(safe-area-inset-bottom));left:max(14px,env(safe-area-inset-left));font-size:10px;color:#fff;text-shadow:0 1px 2px #0008}.keys kbd{font:10px Vazirmatn,sans-serif;background:#0004;border:1px solid #fff6;border-radius:5px;padding:1px 5px;margin:0 2px}.touch .keys{display:none}
.overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:14px;background:#10251cb0;backdrop-filter:blur(6px)}
.dialog{width:min(500px,100%);max-height:calc(var(--game-height,100dvh) - 28px);overflow:auto;background:var(--card);border-radius:26px;padding:24px 26px;box-shadow:0 30px 80px #0006;border:1px solid var(--line);-webkit-user-select:text;user-select:text}
.dialog .badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(#ffe17a,#f6b62a);border:2px solid #7a4a10;color:#7a4a10;float:left;margin-right:12px}
.dialog h2{margin:2px 0 8px;font-size:24px;line-height:1.5}.dialog p{margin:8px 0;line-height:2;color:var(--muted);font-size:13px}.dialog p b{color:var(--ink)}
.dialog .primary{width:100%;min-height:52px;margin-top:14px;background:linear-gradient(#34a87c,#1f7a59);color:#fff;border-color:#1a654a;font-weight:800;font-size:15px;box-shadow:0 6px 16px #1f7a5944}
.dialog .row{display:flex;gap:8px;margin-top:10px}.dialog .row button{flex:1}
.steps{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px;clear:both}.steps li{display:flex;gap:12px;align-items:center;font-size:13px;line-height:1.9}.steps li>b{flex-shrink:0;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.grid div{border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.grid strong{display:block;font-size:19px}.grid small{font-size:10px;color:var(--muted)}
.stars{text-align:center;font-size:34px;letter-spacing:6px;color:#f2a516;direction:ltr;margin:8px 0;clear:both}.stars .off{color:#d9cdb8}
.big{text-align:center;font-size:44px;font-weight:900;color:var(--green);margin:10px 0 0;line-height:1.4;clear:both}
.record{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:12px}.record span:last-child{direction:ltr;color:#f2a516}
.foot{font-size:11px!important;line-height:1.8!important}.dialog input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;direction:ltr;text-align:left;background:var(--card-2);color:var(--ink);font:12px Vazirmatn,sans-serif;margin-top:8px}
.tipbox{clear:both;margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--card-2);border:1px dashed #e0b56a;font-size:13px;line-height:2}
.tipbox .demo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap;direction:rtl}.demo span.p{display:inline-block;height:12px;border-radius:3px;background:linear-gradient(#f2c27f,#c98c4c);border:1.5px solid #6b3f1f}
@media(max-height:430px){.hud{top:6px}.chip{min-height:44px;padding:4px 11px}.actions button{width:44px;height:44px}.level-chip strong{font-size:12px}.stat{font-size:14px}.toast{top:58px;font-size:12px;padding:6px 14px}.padbtn{width:66px;height:66px}.pad.jump .padbtn{width:80px;height:80px}.plank-card{min-height:50px;min-width:54px;padding:4px 6px}.mode{font-size:10px;padding:2px 10px}.dialog{padding:16px 20px}.dialog h2{font-size:19px}.dialog .badge{width:44px;height:44px;font-size:22px}.dialog p{font-size:12px;line-height:1.8;margin:5px 0}.steps{margin:8px 0;gap:6px}.steps li{font-size:12px}.steps li b{width:28px;height:28px}.grid{margin:8px 0}.grid div{padding:6px 2px}.stars{font-size:26px;margin:2px 0}.big{font-size:32px}.dialog .primary{min-height:46px;margin-top:8px}.tipbox{margin:8px 0;padding:8px 12px;font-size:12px}}
@media(max-width:700px){.stats .stat small{display:none}.level-chip small{display:none}}
@media(max-width:560px){.hud{flex-wrap:wrap}.stats{order:3;width:100%;justify-content:center}.toast{top:130px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
